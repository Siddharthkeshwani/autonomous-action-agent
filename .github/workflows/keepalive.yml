name: Supabase keepalive

on:
  schedule:
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - shell: bash
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-max-time 180 \
            --max-time 75 -H 'Accept: application/json' "$RENDER_HEALTH_URL" |
            jq -e '.checks.postgres == true'
